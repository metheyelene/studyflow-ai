name: studyflow_mobile
description: "StudyFlow AI — an AI-powered study workspace for Android and iOS."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.0.0
  cookie_jar: ^4.0.9
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  file_picker: ^12.0.0
  dynamic_color: ^1.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
  in_app_purchase: ^3.2.0
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  # Used by the file-import tests to build fake picked files (XFile for the
  # PlatformFile contract). Already resolved transitively via file_picker.
  cross_file: ^0.3.4

flutter:
  uses-material-design: true
