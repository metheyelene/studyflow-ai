publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  cookie_jar: ^4.0.9
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  dynamic_color: ^1.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
