name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The build needs env vars to exist; CI uses placeholders — real
      # secrets live only in Vercel, never in the repo.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/studyflow
          DATABASE_URL_DIRECT: postgres://ci:ci@localhost:5432/studyflow
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-a-real-secret

  flutter:
    # Pinned runner image (not `-latest`, which retags when GitHub promotes
    # a new Ubuntu): the golden rasterizer can differ across OS versions,
    # so the goldens must always render on the same OS as their baselines.
    name: Flutter · format · analyze · test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the goldens were generated with — the software
          # rasterizer is engine-version-sensitive, so an unpinned `stable`
          # can drift baselines on a routine SDK bump.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Format check
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      # Golden-image gate: regenerate the baselines on the pinned Linux
      # container (ubuntu-24.04 + Flutter 3.44.9 — the OS/engine the
      # baselines belong to), then fail if the result differs from what is
      # committed. `flutter test` above already diffs them read-only; this
      # step both produces the fresh images and surfaces exactly which
      # files drifted. When a change is intentional, commit the regenerated
      # PNGs (or the diff from the CI log) with the change.
      - name: Golden baselines (regenerate + diff)
        working-directory: mobile
        run: |
          flutter test test/theme_golden_test.dart --update-goldens
          git diff --stat -- test/goldens test/theme_golden_test.dart
          git diff --exit-code -- test/goldens test/theme_golden_test.dart

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
