name: Release

# Creates a downloadable GitHub Release from a signed Android build.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#
# The Android APK/AAB are signed with the StudyFlow release keystore, which
# lives ONLY as GitHub secrets (STUDYFLOW_KEYSTORE_*). Never commit it.
#
# The API base URL the app talks to comes from the `API_BASE_URL` repository
# variable (Settings → Secrets and variables → Actions → Variables). Set it
# to your deployed backend before distributing, then re-tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          working-directory: mobile

      - name: Decode release keystore
        run: |
          echo "${{ secrets.STUDYFLOW_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/studyflow-release.jks"

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
        env:
          STUDYFLOW_KEYSTORE_PATH: ${{ runner.temp }}/studyflow-release.jks
          STUDYFLOW_KEYSTORE_PASSWORD: ${{ secrets.STUDYFLOW_KEYSTORE_PASSWORD }}
          STUDYFLOW_KEY_ALIAS: ${{ secrets.STUDYFLOW_KEY_ALIAS }}
          STUDYFLOW_KEY_PASSWORD: ${{ secrets.STUDYFLOW_KEY_PASSWORD }}

      - name: Build release App Bundle (Play Store)
        working-directory: mobile
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
        env:
          STUDYFLOW_KEYSTORE_PATH: ${{ runner.temp }}/studyflow-release.jks
          STUDYFLOW_KEYSTORE_PASSWORD: ${{ secrets.STUDYFLOW_KEYSTORE_PASSWORD }}
          STUDYFLOW_KEY_ALIAS: ${{ secrets.STUDYFLOW_KEY_ALIAS }}
          STUDYFLOW_KEY_PASSWORD: ${{ secrets.STUDYFLOW_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)/apksigner" verify --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mobile/build/app/outputs/flutter-apk/app-release.apk \
            mobile/build/app/outputs/bundle/release/app-release.aab \
            --title "StudyFlow AI $GITHUB_REF_NAME" \
            --notes "Signed Android build. APK installs directly on any Android phone (Settings → Allow unknown sources); the .aab is for the Play Store.

**Before distributing:** set the \`API_BASE_URL\` repository variable to your deployed backend, then push a new tag — otherwise the app cannot sign in."

  ios:
    name: Verify iOS build compiles (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          working-directory: mobile

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.ref_name }}
          path: mobile/build/ios/iphoneos/*.app
